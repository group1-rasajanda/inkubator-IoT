<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pro Inkubator Telur - Kelompok 1</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: none; border-radius: 10px; margin-bottom: 20px; }
        .val-text { font-size: 2.5rem; font-weight: bold; }
        .indicator { width: 20px; height: 20px; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .lamp-on { background-color: #f1c40f; box-shadow: 0 0 10px #f1c40f; }
        .lamp-off { background-color: #bdc3c7; }
        .table-wrapper { max-height: 400px; overflow-y: auto; }
        .day-counter { font-size: 1.5rem; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

<div class="container py-4">
    <h2 class="text-center mb-4 border-bottom pb-3">⚙️ MONITORING INKUBATOR TELUR (PRO)</h2>

    <div class="card p-3 bg-white border-top border-4 border-primary">
        <div class="row align-items-center">
            <div class="col-md-4 text-center mt-2">
                <span class="text-muted">Proses Penetasan:</span><br>
                <span class="day-counter">HARI KE- <span id="rt-hari">0</span></span>
            </div>
            <div class="col-md-8 text-center mt-3 mt-md-0 border-start">
                <label class="mb-2 fw-bold">Kontrol Roller Motor Manual (Firebase)</label><br>
                <button id="btnMotorOn" class="btn btn-warning fw-bold px-4 me-2" onclick="kontrolMotor(true)">🔄 PUTAR MOTOR</button>
                <button id="btnMotorOff" class="btn btn-secondary fw-bold px-4" onclick="kontrolMotor(false)">⏹ STOP MOTOR</button>
                <div class="mt-2 small text-muted">*Klik STOP agar motor kembali ke mode otomatis (tiap 3 jam)</div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card text-center p-3 border-top border-4 border-danger">
                <h5 class="text-muted">Suhu Ruangan</h5>
                <div class="val-text text-danger"><span id="rt-suhu">--.-</span>°C</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center p-3 border-top border-4 border-info">
                <h5 class="text-muted">Kelembapan</h5>
                <div class="val-text text-primary"><span id="rt-hum">--</span>%</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 h-100 justify-content-center border-top border-4 border-warning">
                <h5 class="text-center text-muted">Status Pemanas</h5>
                <div class="d-flex justify-content-center align-items-center mt-2">
                    <div id="ind-lampu" class="indicator lamp-off"></div> 
                    <strong id="teks-lampu" class="fs-5">MATI</strong>
                </div>
            </div>
        </div>
    </div>

    <div class="card p-3 bg-light mb-4">
        <div class="row align-items-center">
            <div class="col-md-6 mb-2 mb-md-0">
                <div class="d-flex align-items-center">
                    <label class="fw-bold me-2 text-nowrap">⏱️ Interval Live:</label>
                    <input type="number" id="inputInterval" class="form-control form-control-sm text-center fw-bold" style="width: 70px;" value="10" min="1" onchange="ubahInterval()">
                    <span class="ms-2 me-3 fw-bold text-muted">Menit</span>
                </div>
            </div>
            <div class="col-md-6 text-md-end">
                <span class="fw-bold me-2">📥 Download Data Excel:</span>
                <button class="btn btn-sm btn-outline-primary me-1" onclick="downloadCSVLive()">Tabel Live Saat Ini</button>
                <button class="btn btn-sm btn-success fw-bold" onclick="downloadCSVDatabaseFull()">Seluruh Riwayat Hari (Database)</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-7">
            <div class="card p-3">
                <h5>📈 Grafik Suhu & Kelembapan</h5>
                <canvas id="myChart" height="150"></canvas>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card p-3">
                <h5 class="mb-2">📋 Log Data Live (<span id="txt-interval-aktif">10 Menit</span>)</h5>
                <div class="table-wrapper">
                    <table class="table table-striped table-hover table-sm text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>Waktu</th>
                                <th>Hari</th>
                                <th>Suhu (°C)</th>
                                <th>Lembap (%)</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // ================= 1. KONFIGURASI FIREBASE =================
    const firebaseConfig = {
        apiKey: "AIzaSyAPvaAMhccxrRedhDrpjEDZDW-WfZjPkFA", 
        authDomain: "inkubatortelur-group1.firebaseapp.com",
        databaseURL: "https://inkubatortelur-group1-default-rtdb.firebaseio.com",
        projectId: "inkubatortelur-group1",
        storageBucket: "inkubatortelur-group1.appspot.com",
        messagingSenderId: "1049772171486",
        appId: "1:1049772171486:web:241cc5ccf993e4ace3a24f"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ================= 2. INISIALISASI GRAFIK =================
    const ctx = document.getElementById('myChart').getContext('2d');
    const myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                { label: 'Suhu (°C)', borderColor: '#e74c3c', backgroundColor: 'rgba(231, 76, 60, 0.2)', data: [], tension: 0.3, yAxisID: 'y' },
                { label: 'Kelembapan (%)', borderColor: '#3498db', backgroundColor: 'rgba(52, 152, 219, 0.2)', data: [], tension: 0.3, yAxisID: 'y1' }
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: { type: 'linear', display: true, position: 'left' },
                y1: { type: 'linear', display: true, position: 'right', grid: {drawOnChartArea: false} }
            }
        }
    });

    // ================= VARIABEL INTERVAL (DEFAULT 10 MENIT) =================
    let lastLogTime = 0;
    let logIntervalMs = 600000; // 10 Menit dalam milidetik (10 * 60 * 1000)

    function ubahInterval() {
        const inputVal = parseInt(document.getElementById('inputInterval').value) || 1;
        logIntervalMs = inputVal * 60000; // Ubah menit ke milidetik
        document.getElementById('txt-interval-aktif').innerText = inputVal + " Menit";
    }

    // ================= 3. AMBIL DATA MONITORING (LIVE) =================
    const monitorRef = database.ref('/monitoring');
    monitorRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            const suhu = parseFloat(data.temp) || 0;
            const hum = parseFloat(data.humi) || 0;
            const hari = data.hari || 0;
            const lampuStatus = data.lampuStatus;
            
            const now = new Date();
            const dateString = now.toLocaleDateString('id-ID');
            const timeString = now.toLocaleTimeString('id-ID');

            // Update Angka di Layar
            document.getElementById('rt-suhu').innerText = suhu.toFixed(1);
            document.getElementById('rt-hum').innerText = hum.toFixed(1);
            document.getElementById('rt-hari').innerText = hari;

            // Update Status Lampu
            if (lampuStatus === true || lampuStatus === 1) {
                document.getElementById('ind-lampu').className = "indicator lamp-on";
                document.getElementById('teks-lampu').innerText = "MENYALA";
                document.getElementById('teks-lampu').className = "fs-5 text-warning";
            } else {
                document.getElementById('ind-lampu').className = "indicator lamp-off";
                document.getElementById('teks-lampu').innerText = "MATI";
                document.getElementById('teks-lampu').className = "fs-5 text-secondary";
            }

            // SIMPAN KE HISTORI HARIAN DI FIREBASE
            const safeTimeKey = timeString.replace(/[:.#$\[\]\s]/g, '-'); 
            
            try {
                database.ref(`/riwayat_harian/hari_${hari}/${safeTimeKey}`).set({
                    tanggal: dateString,
                    waktu: timeString,
                    suhu: suhu.toFixed(1),
                    kelembapan: hum.toFixed(1)
                });
            } catch (err) {
                console.error("Firebase Key Error:", err);
            }

            // Update Grafik & Tabel Live Browser
            if (Date.now() - lastLogTime >= logIntervalMs) {
                lastLogTime = Date.now();
                
                const tbody = document.getElementById('tableBody');
                const row = `<tr><td>${timeString}</td><td>${hari}</td><td>${suhu.toFixed(1)}</td><td>${hum.toFixed(1)}</td></tr>`;
                tbody.insertAdjacentHTML('afterbegin', row);

                myChart.data.labels.push(timeString);
                myChart.data.datasets[0].data.push(suhu);
                myChart.data.datasets[1].data.push(hum);
                
                if(myChart.data.labels.length > 20) {
                    myChart.data.labels.shift();
                    myChart.data.datasets[0].data.shift();
                    myChart.data.datasets[1].data.shift();
                }
                myChart.update();
            }
        }
    });

    // ================= 4. KONTROL MOTOR MANUAL =================
    function kontrolMotor(state) {
        database.ref('/kontrol').update({ motorManual: state })
        .then(() => {
            if(state) alert("Perintah PUTAR dikirim ke ESP32!");
            else alert("Perintah STOP dikirim. Mode kembali otomatis.");
        }).catch((error) => {
            alert("Gagal mengirim perintah: " + error);
        });
    }

    // ================= 5. EXPORT EXCEL (TABEL LIVE SAAT INI) =================
    function downloadCSVLive() {
        let csv = "Waktu;Hari;Suhu (C);Kelembapan (%)\n";
        const rows = document.querySelectorAll("#tableBody tr");
        if (rows.length === 0) return alert("Tabel live saat ini masih kosong!");
        
        rows.forEach(row => {
            let cols = row.querySelectorAll("td");
            csv += `${cols[0].innerText};${cols[1].innerText};${cols[2].innerText};${cols[3].innerText}\n`;
        });

        unduhFileCSV(csv, "Data_Live_Inkubator_Rapi.csv");
    }

    // ================= 6. EXPORT EXCEL (SELURUH DATA DARI DATABASE) =================
    function downloadCSVDatabaseFull() {
        const btn = event.target;
        btn.innerText = "Mengambil data...";
        btn.disabled = true;

        database.ref('/riwayat_harian').once('value').then((snapshot) => {
            const semuaHari = snapshot.val();
            if (!semuaHari) {
                alert("Belum ada riwayat data di database!");
                btn.innerText = "Seluruh Riwayat Hari (Database)";
                btn.disabled = false;
                return;
            }

            let csv = "Hari Penetasan;Tanggal;Waktu;Suhu (C);Kelembapan (%)\n";

            Object.keys(semuaHari).forEach(hariKey => {
                const nomorHari = hariKey.replace('hari_', '');
                const rekamanHariIni = semuaHari[hariKey];

                Object.keys(rekamanHariIni).forEach(waktuKey => {
                    const d = rekamanHariIni[waktuKey];
                    csv += `${nomorHari};${d.tanggal};${d.waktu};${d.suhu};${d.kelembapan}\n`;
                });
            });

            unduhFileCSV(csv, "Riwayat_Lengkap_Penetasan_Kel1_Rapi.csv");
            
            btn.innerText = "Seluruh Riwayat Hari (Database)";
            btn.disabled = false;
        }).catch(err => {
            alert("Gagal menarik data dari database: " + err);
            btn.innerText = "Seluruh Riwayat Hari (Database)";
            btn.disabled = false;
        });
    }

    // Fungsi trigger unduhan browser
    function unduhFileCSV(stringCSV, namaFile) {
        let blob = new Blob([stringCSV], { type: "text/csv;charset=utf-8;" });
        let url = window.URL.createObjectURL(blob);
        let a = document.createElement("a");
        a.href = url;
        a.download = namaFile;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>
</body>
</html>
